name: 노리 공모사업 알림봇

on:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다. (평일 한국시간 09:00 / 14:00)
    - cron: "0 0 * * 1-5"   # 09:00 KST
    - cron: "0 5 * * 1-5"   # 14:00 KST
  workflow_dispatch:        # Actions 탭에서 '수동 실행' 버튼 제공

permissions:
  contents: write            # state.json(중복방지 기록)을 저장소에 다시 커밋하기 위함

concurrency:
  group: welfare-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 알림봇 실행
        env:
          # 테스트/기본 채널 (Slack·Discord·Teams·Telegram 등)
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # 네이버웍스 Bot 연동 시에만 사용 (없으면 자동으로 WEBHOOK_URL 사용)
          NW_BOT_ID: ${{ secrets.NW_BOT_ID }}
          NW_CHANNEL_ID: ${{ secrets.NW_CHANNEL_ID }}
          NW_CLIENT_ID: ${{ secrets.NW_CLIENT_ID }}
          NW_CLIENT_SECRET: ${{ secrets.NW_CLIENT_SECRET }}
          NW_SERVICE_ACCOUNT: ${{ secrets.NW_SERVICE_ACCOUNT }}
          NW_PRIVATE_KEY: ${{ secrets.NW_PRIVATE_KEY }}
        run: python welfare_alert.py

      - name: 확인 기록 저장 (state.json 변경 시에만 커밋)
        if: always()   # 발송 일부 실패로 앞 step이 비정상 종료해도, 성공분 기록은 커밋
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update notified state [skip ci]"
            git push
          else
            echo "변경 없음 — 커밋 건너뜀"
          fi
